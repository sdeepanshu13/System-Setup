name: Build & Release Setup.exe

# Produces the single downloadable file users get. Tag a release to publish:
#   git tag v1.0.1 && git push origin v1.0.1
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ps2exe
        shell: powershell
        run: Install-Module ps2exe -Scope CurrentUser -Force -Repository PSGallery

      - name: Build Setup.exe
        shell: powershell
        working-directory: Windows
        run: .\Build-Exe.ps1

      - name: Verify no secret keys were embedded
        shell: powershell
        run: |
          # Read as bytes: Select-String can't scan binaries reliably.
          $bytes = [IO.File]::ReadAllBytes("$PWD\dist\Setup.exe")
          $text  = [Text.Encoding]::ASCII.GetString($bytes)
          # Match real key shapes, not the guard words that legitimately appear in source.
          $patterns = @('sb_secret_[A-Za-z0-9]{10,}', 'xkeysib-[A-Za-z0-9]{20,}', 'eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}')
          $found = @()
          foreach ($p in $patterns) {
            if ($text -match $p) { $found += $Matches[0].Substring(0, 24) + '...' }
          }
          if ($found.Count -gt 0) {
            Write-Host "::error::Secret-looking material found in the artifact:"
            $found | ForEach-Object { Write-Host "  $_" }
            exit 1
          }
          Write-Host "Clean: no secret keys in the artifact."

      - uses: actions/upload-artifact@v4
        with:
          name: Setup.exe
          path: dist/Setup.exe

      - name: Publish to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Setup.exe
          generate_release_notes: true
