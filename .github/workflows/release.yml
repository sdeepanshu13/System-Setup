name: Build & Release Setup.exe

# Every push to main cuts a new release and repoints the README, so the
# documented download is always the newest commit's build.
#
# Trade-off: each release is a brand-new binary with no reputation, which is
# what Defender's ML penalises. Code signing is what fixes that -- see
# Windows/README.md#code-signing.
#
# Loop guard: this workflow pushes a README commit itself. That commit carries
# [skip ci] and the job also ignores the bot actor, so it can't retrigger
# endlessly.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    if: >-
      !contains(github.event.head_commit.message, '[skip ci]') &&
      github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags needed to work out the next version

      - name: Work out the next version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            git fetch --tags --quiet || true
            LATEST=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1)
            if [[ -z "$LATEST" ]]; then
              TAG="v1.0.0"
            else
              V="${LATEST#v}"
              MAJOR="${V%%.*}"; REST="${V#*.}"
              MINOR="${REST%%.*}"
              PATCH="${REST#*.}"
              [[ "$PATCH" == "$REST" ]] && PATCH=0          # tags like v1.0
              [[ "$PATCH" =~ ^[0-9]+$ ]] || PATCH=0
              TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG"

      - name: Did the launcher itself change?
        id: launcher
        shell: bash
        run: |
          set -euo pipefail
          # The launcher is a bootstrapper: it fetches the app at run time, so it
          # only needs rebuilding when its own source changes. Rebuilding every
          # push would churn the file hash, and Defender scores unsigned
          # binaries on per-hash reputation -- which is what got downloads
          # quarantined in the first place.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            CHANGED=yes
          elif git rev-parse HEAD~1 >/dev/null 2>&1 &&
               git diff --name-only HEAD~1 HEAD | grep -qE '^(install\.ps1|Windows/installer\.iss|Windows/Build-Installer\.ps1)$'; then
            CHANGED=yes
          elif ! gh release view launcher --json assets --jq '.assets[].name' 2>/dev/null | grep -q Setup.exe; then
            CHANGED=yes   # no launcher published yet
          else
            CHANGED=no
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "launcher rebuild needed: $CHANGED"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build launcher (Inno Setup)
        if: steps.launcher.outputs.changed == 'yes'
        shell: powershell
        working-directory: Windows
        run: .\Build-Installer.ps1

      # Runs only when the signing secrets exist, so forks build fine unsigned.
      - name: Sign Setup.exe
        if: ${{ steps.launcher.outputs.changed == 'yes' && env.CODE_SIGN_PFX_BASE64 != '' }}
        shell: powershell
        working-directory: Windows
        env:
          CODE_SIGN_PFX_BASE64: ${{ secrets.CODE_SIGN_PFX_BASE64 }}
          CODE_SIGN_PASSWORD: ${{ secrets.CODE_SIGN_PASSWORD }}
        run: .\Sign-Exe.ps1

      - name: Report signature status
        if: steps.launcher.outputs.changed == 'yes'
        shell: powershell
        run: |
          $sig = Get-AuthenticodeSignature "$PWD\dist\Setup.exe"
          Write-Host "Signature: $($sig.Status)"
          if ($sig.SignerCertificate) { Write-Host "Signer: $($sig.SignerCertificate.Subject)" }
          else { Write-Host '::warning::Artifact is unsigned - users will see a SmartScreen prompt.' }

      - name: Verify no secret keys were embedded
        if: steps.launcher.outputs.changed == 'yes'
        shell: powershell
        run: |
          # Read as bytes: Select-String can't scan binaries reliably.
          $bytes = [IO.File]::ReadAllBytes("$PWD\dist\Setup.exe")
          $text  = [Text.Encoding]::ASCII.GetString($bytes)
          # Match real key shapes, not the guard words that legitimately appear in source.
          $patterns = @('sb_secret_[A-Za-z0-9]{10,}', 'xkeysib-[A-Za-z0-9]{20,}', 'eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}')
          $found = @()
          foreach ($p in $patterns) {
            if ($text -match $p) { $found += $Matches[0].Substring(0, 24) + '...' }
          }
          if ($found.Count -gt 0) {
            Write-Host "::error::Secret-looking material found in the artifact:"
            $found | ForEach-Object { Write-Host "  $_" }
            exit 1
          }
          Write-Host "Clean: no secret keys in the artifact."

      # Lets users confirm the download matches what CI built. Doesn't remove the
      # SmartScreen prompt -- only a CA certificate does that.
      - name: Generate checksum
        if: steps.launcher.outputs.changed == 'yes'
        shell: powershell
        run: |
          Push-Location dist
          $h = Get-FileHash Setup.exe -Algorithm SHA256
          "{0}  Setup.exe" -f $h.Hash.ToLower() | Set-Content SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt
          Pop-Location

      # The launcher lives on its own fixed tag so its download URL never
      # changes and its reputation isn't reset by app releases.
      - name: Publish launcher
        if: steps.launcher.outputs.changed == 'yes'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: launcher
          name: Launcher
          body: |
            Bootstrapper for System-Setup. It fetches the current version at run
            time, so this file rarely changes and you always get the newest app.

            Download: https://github.com/${{ github.repository }}/releases/download/launcher/Setup.exe
          files: |
            dist/Setup.exe
            dist/SHA256SUMS.txt
          make_latest: "false"

      - name: Tag this build
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "$TAG"
            git push origin "$TAG"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          make_latest: "true"

      # The README points at the launcher's fixed URL, so it needs no rewriting
      # per release -- the launcher always pulls the newest code itself.
      - name: Confirm README points at the launcher
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'releases/download/launcher/Setup.exe' README.md; then
            echo "README points at the launcher URL."
          else
            echo "::warning::README does not reference the launcher download URL."
          fi
