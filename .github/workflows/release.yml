name: Build & Release Setup.exe

# Produces the single downloadable file users get. Tag a release to publish:
#   git tag v1.0.1 && git push origin v1.0.1
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ps2exe
        shell: powershell
        run: Install-Module ps2exe -Scope CurrentUser -Force -Repository PSGallery

      - name: Build Setup.exe
        shell: powershell
        working-directory: Windows
        run: .\Build-Exe.ps1

      # Runs only when the signing secrets exist, so forks build fine unsigned.
      - name: Sign Setup.exe
        if: ${{ env.CODE_SIGN_PFX_BASE64 != '' }}
        shell: powershell
        working-directory: Windows
        env:
          CODE_SIGN_PFX_BASE64: ${{ secrets.CODE_SIGN_PFX_BASE64 }}
          CODE_SIGN_PASSWORD: ${{ secrets.CODE_SIGN_PASSWORD }}
        run: .\Sign-Exe.ps1

      - name: Report signature status
        shell: powershell
        run: |
          $sig = Get-AuthenticodeSignature "$PWD\dist\Setup.exe"
          Write-Host "Signature: $($sig.Status)"
          if ($sig.SignerCertificate) { Write-Host "Signer: $($sig.SignerCertificate.Subject)" }
          else { Write-Host '::warning::Artifact is unsigned - users will see a SmartScreen prompt.' }

      - name: Verify no secret keys were embedded
        shell: powershell
        run: |
          # Read as bytes: Select-String can't scan binaries reliably.
          $bytes = [IO.File]::ReadAllBytes("$PWD\dist\Setup.exe")
          $text  = [Text.Encoding]::ASCII.GetString($bytes)
          # Match real key shapes, not the guard words that legitimately appear in source.
          $patterns = @('sb_secret_[A-Za-z0-9]{10,}', 'xkeysib-[A-Za-z0-9]{20,}', 'eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}')
          $found = @()
          foreach ($p in $patterns) {
            if ($text -match $p) { $found += $Matches[0].Substring(0, 24) + '...' }
          }
          if ($found.Count -gt 0) {
            Write-Host "::error::Secret-looking material found in the artifact:"
            $found | ForEach-Object { Write-Host "  $_" }
            exit 1
          }
          Write-Host "Clean: no secret keys in the artifact."

      - uses: actions/upload-artifact@v4
        with:
          name: Setup.exe
          path: dist/Setup.exe

      - name: Publish to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Setup.exe
          generate_release_notes: true
          make_latest: "true"

      # GitHub's /releases/latest/download/ redirect has served a stale asset
      # before, so the README points at the exact version and is refreshed here.
      - name: Point README at this release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          SIZE=$(stat -c%s dist/Setup.exe)
          PRETTY=$(printf "%'d" "$SIZE")

          git fetch origin main --quiet
          git checkout main --quiet
          sed -i -E "s#releases/download/v[0-9]+\.[0-9]+\.[0-9]+/Setup\.exe#releases/download/${TAG}/Setup.exe#g" README.md
          sed -i -E "s#Download Setup\.exe \(v[0-9]+\.[0-9]+\.[0-9]+\)#Download Setup.exe (${TAG})#g" README.md
          sed -i -E "s#\*\*~[0-9.]+ MB \([0-9,]+ bytes\)\*\*#**~$(awk "BEGIN{printf \"%.1f\", ${SIZE}/1048576}") MB (${PRETTY} bytes)**#g" README.md

          if git diff --quiet README.md; then
            echo "README already current."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -qm "README: point download link at ${TAG}" README.md
            git push origin main
            echo "README updated to ${TAG}."
          fi
