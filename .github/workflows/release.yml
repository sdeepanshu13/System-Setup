name: Build & Release Setup.exe

# Produces the single downloadable file users get. Tag a release to publish:
#   git tag v1.0.1 && git push origin v1.0.1
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ps2exe
        shell: powershell
        run: Install-Module ps2exe -Scope CurrentUser -Force -Repository PSGallery

      - name: Build Setup.exe
        shell: powershell
        working-directory: Windows
        run: .\Build-Exe.ps1

      - name: Verify no secret keys were embedded
        shell: powershell
        run: |
          $hit = Select-String -Path dist\Setup.exe -Pattern 'sb_secret','service_role' `
            -SimpleMatch -Encoding byte -ErrorAction SilentlyContinue
          if ($hit) { throw 'Secret key found in the built exe -- aborting release.' }
          Write-Host 'Clean: no secret keys in the artifact.'

      - uses: actions/upload-artifact@v4
        with:
          name: Setup.exe
          path: dist/Setup.exe

      - name: Publish to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Setup.exe
          generate_release_notes: true
