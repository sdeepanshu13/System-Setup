name: Build & Release Setup.exe

# Every push to main cuts a new release and repoints the README, so the
# documented download is always the newest commit's build.
#
# Trade-off: each release is a brand-new binary with no reputation, which is
# what Defender's ML penalises. Code signing is what fixes that -- see
# Windows/README.md#code-signing.
#
# Loop guard: this workflow pushes a README commit itself. That commit carries
# [skip ci] and the job also ignores the bot actor, so it can't retrigger
# endlessly.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    if: >-
      !contains(github.event.head_commit.message, '[skip ci]') &&
      github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags needed to work out the next version

      - name: Work out the next version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            git fetch --tags --quiet || true
            LATEST=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1)
            if [[ -z "$LATEST" ]]; then
              TAG="v1.0.0"
            else
              V="${LATEST#v}"
              MAJOR="${V%%.*}"; REST="${V#*.}"
              MINOR="${REST%%.*}"
              PATCH="${REST#*.}"
              [[ "$PATCH" == "$REST" ]] && PATCH=0          # tags like v1.0
              [[ "$PATCH" =~ ^[0-9]+$ ]] || PATCH=0
              TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG"

      - name: Build Setup.exe (Inno Setup)
        shell: powershell
        working-directory: Windows
        run: .\Build-Installer.ps1 -Version '${{ steps.ver.outputs.tag }}'

      # Runs only when the signing secrets exist, so forks build fine unsigned.
      - name: Sign Setup.exe
        if: ${{ env.CODE_SIGN_PFX_BASE64 != '' }}
        shell: powershell
        working-directory: Windows
        env:
          CODE_SIGN_PFX_BASE64: ${{ secrets.CODE_SIGN_PFX_BASE64 }}
          CODE_SIGN_PASSWORD: ${{ secrets.CODE_SIGN_PASSWORD }}
        run: .\Sign-Exe.ps1

      - name: Report signature status
        shell: powershell
        run: |
          $sig = Get-AuthenticodeSignature "$PWD\dist\Setup.exe"
          Write-Host "Signature: $($sig.Status)"
          if ($sig.SignerCertificate) { Write-Host "Signer: $($sig.SignerCertificate.Subject)" }
          else { Write-Host '::warning::Artifact is unsigned - users will see a SmartScreen prompt.' }

      - name: Verify no secret keys were embedded
        shell: powershell
        run: |
          # Read as bytes: Select-String can't scan binaries reliably.
          $bytes = [IO.File]::ReadAllBytes("$PWD\dist\Setup.exe")
          $text  = [Text.Encoding]::ASCII.GetString($bytes)
          # Match real key shapes, not the guard words that legitimately appear in source.
          $patterns = @('sb_secret_[A-Za-z0-9]{10,}', 'xkeysib-[A-Za-z0-9]{20,}', 'eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}')
          $found = @()
          foreach ($p in $patterns) {
            if ($text -match $p) { $found += $Matches[0].Substring(0, 24) + '...' }
          }
          if ($found.Count -gt 0) {
            Write-Host "::error::Secret-looking material found in the artifact:"
            $found | ForEach-Object { Write-Host "  $_" }
            exit 1
          }
          Write-Host "Clean: no secret keys in the artifact."

      # Lets users confirm the download matches what CI built. Doesn't remove the
      # SmartScreen prompt -- only a CA certificate does that.
      - name: Generate checksum
        shell: powershell
        run: |
          Push-Location dist
          $h = Get-FileHash Setup.exe -Algorithm SHA256
          "{0}  Setup.exe" -f $h.Hash.ToLower() | Set-Content SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt
          Pop-Location

      - uses: actions/upload-artifact@v4
        with:
          name: Setup.exe
          path: dist/Setup.exe

      - name: Tag this build
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "$TAG"
            git push origin "$TAG"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: |
            dist/Setup.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
          make_latest: "true"

      # GitHub's /releases/latest/download/ redirect has served a stale asset
      # before, so the README points at the exact version and is refreshed here.
      - name: Point README at this release
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          SIZE=$(stat -c%s dist/Setup.exe)
          PRETTY=$(printf "%'d" "$SIZE")
          MB=$(awk "BEGIN{printf \"%.1f\", ${SIZE}/1048576}")

          git checkout main --quiet
          git pull --ff-only --quiet origin main || true

          sed -i -E "s#releases/download/v[0-9]+(\.[0-9]+)+/Setup\.exe#releases/download/${TAG}/Setup.exe#g" README.md
          sed -i -E "s#Download Setup\.exe \(v[0-9]+(\.[0-9]+)+\)#Download Setup.exe (${TAG})#g" README.md
          sed -i -E "s#\*\*~[0-9.]+ MB \([0-9,]+ bytes\)\*\*#**~${MB} MB (${PRETTY} bytes)**#g" README.md

          if git diff --quiet README.md; then
            echo "README already current."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -qm "README: point download at ${TAG} [skip ci]" README.md
            git push origin main
            echo "README updated to ${TAG}."
          fi
